name: My First Workflow
on:
  push:
    branches:
      - main

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
        - name: Print Hello World
          run: echo "Hello, World!"
        - name: Move files from root folder to runner
          run: |
            mkdir -p /home/runner/work/my-repo/my-repo
            shopt -s dotglob
            mv -- !(.github) /home/runner/work/my-repo/my-repo/ || true
        - name: List files
          run: ls -la /home/runner/work/my-repo/my-repo/
        - name: Read file content
          run: cat README.md

