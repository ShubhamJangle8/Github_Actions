name: My First Workflow
on:
  push:
    branches:
      - main
      - test

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
        - name: Print Hello World
          run: echo "Hello, World!"
        - name: Checkout Code
          uses: actions/checkout@v2
        - name: List files
          run: ls -la 
        - name: Read file content
          run: cat README.md
        - name: Dump context
          run: echo "${{ toJson(github.job) }}"
            
